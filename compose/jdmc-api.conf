server {
    listen 9897 ssl;
    server_name localhost;
    ssl_certificate /run/jdmc-api/server.crt;
    ssl_certificate_key /run/jdmc-api/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    resolver 127.0.0.11 valid=15s ipv6=off;
    location /api/ {
        set $core_upstream core:8080;
        proxy_set_header Host localhost;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://$core_upstream$request_uri;
    }
    location / { return 404; }
}
