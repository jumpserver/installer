services:
  core:
    image: ${JDMC_CORE_IMAGE:-${NAMESPACE:-jumpserver}/core:${VERSION}}
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "jdmc.host.internal=${JDMC_CALLBACK_HOST:-host-gateway}"
    volumes:
      - "${VOLUME_DIR:-/data/jumpserver}/../jdmc/config/core:/run/jdmc-core:ro"
