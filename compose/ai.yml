services:
  ai:
    image: ${NAMESPACE:-jumpserver}/core:${VERSION}
    container_name: jms_ai
    hostname: jms_ai
    ulimits:
      core: 0
    restart: always
    command: start ai
    env_file:
      - ${CONFIG_FILE}
    environment:
      CORE_WORKER: ${CHAT_AI_WORKERS:-2}
      CHAT_AI_CORE_BASE_URL: ${CHAT_AI_CORE_BASE_URL:-http://core:8080}
      LC_ALL: C.UTF-8
    volumes:
      - ${CONFIG_DIR}/certs:/opt/jumpserver/data/certs
      - ${VOLUME_DIR}/core/data:/opt/jumpserver/data
    healthcheck:
      test: "check http://localhost:8088/api/health/"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - net
