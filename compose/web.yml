services:
  web:
    image: ${NAMESPACE:-jumpserver}/web:${VERSION}
    container_name: jms_web
    hostname: jms_web
    ulimits:
      core: 0
      memlock:
        soft: -1
        hard: -1
    restart: always
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      HTTP_PORT: 80
      USE_LB: ${USE_LB:-1}
      USE_IPV6: ${USE_IPV6:-0}
      USE_XPACK: ${USE_XPACK:-0}
      GZIP: ${GZIP:-on}
      CLIENT_MAX_BODY_SIZE: ${CLIENT_MAX_BODY_SIZE:-4096m}
      CORE_ENABLED: ${CORE_ENABLED:-1}
      CHAT_AI_SERVICE_ENABLED: ${AI_ENABLED:-1}
      KOKO_ENABLED: ${KOKO_ENABLED:-1}
      CHEN_ENABLED: ${CHEN_ENABLED:-1}
      KAEL_ENABLED: ${KAEL_ENABLED:-0}
      RAZOR_ENABLED: ${RAZOR_ENABLED:-1}
      # Compatibility for older web images; the value is derived from the
      # edition and is not a user-configurable JDMC switch.
      JDMC_ENABLED: ${USE_XPACK:-0}
      BASIC_AUTH_PASSWORD: ${BASIC_AUTH_PASSWORD:-}
    volumes:
      - ${VOLUME_DIR}/core/data:/opt/jumpserver/data
      - ${VOLUME_DIR}/nginx/data/logs:/var/log/nginx
      - /sys/fs/bpf:/sys/fs/bpf
    healthcheck:
      test: "check http://localhost/web/health/"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s
    networks:
      - net
    extra_hosts:
      - "host.docker.internal:host-gateway"
