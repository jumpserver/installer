services:
  postgresql:
    image: postgres:18.6-bookworm
    container_name: jms_postgresql
    restart: always
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      POSTGRES_DB: $DB_NAME
      POSTGRES_USER: $DB_USER
      POSTGRES_PASSWORD: $DB_PASSWORD
      # Keep the data path used by existing installations and JDMC on every major.
      PGDATA: /var/lib/postgresql/data
    volumes:
      # PostgreSQL 18 declares this parent volume; make it explicit for JDMC.
      - ${VOLUME_DIR}/postgresql:/var/lib/postgresql
      - ${VOLUME_DIR}/postgresql/data:/var/lib/postgresql/data
    healthcheck:
      test: "pg_isready -q -U $$POSTGRES_USER"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - net
