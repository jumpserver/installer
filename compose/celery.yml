services:
  celery:
    image: ${NAMESPACE:-jumpserver}/core:${VERSION}
    container_name: jms_celery
    hostname: jms_celery
    ulimits:
      core: 0
    restart: always
    command: start task
    env_file:
      - ${CONFIG_FILE}
    environment:
      LC_ALL: C.UTF-8
      ANSIBLE_EXECUTION_BACKEND: ssh
      ANSIBLE_EXECUTOR_HOST: ${ANSIBLE_EXECUTOR_HOST:-ansible-executor}
      ANSIBLE_EXECUTOR_PORT: ${ANSIBLE_EXECUTOR_PORT:-2222}
      ANSIBLE_EXECUTOR_PRIVATE_KEY: /run/jms-executor/client
      ANSIBLE_EXECUTOR_KNOWN_HOSTS: /run/jms-executor/known_hosts
      ANSIBLE_EXECUTOR_GATEWAY_HOST: ${ANSIBLE_EXECUTOR_GATEWAY_HOST:-celery}
    volumes:
      - ${CONFIG_DIR}/certs:/opt/jumpserver/data/certs
      - ${VOLUME_DIR}/core/data:/opt/jumpserver/data
      - ${CONFIG_DIR}/ansible-executor/client:/run/jms-executor:ro
    healthcheck:
      test: "bash /opt/jumpserver/utils/check_celery.sh"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - net
