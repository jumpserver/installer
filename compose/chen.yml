services:
  chen:
    image: ${NAMESPACE:-jumpserver}/chen:${VERSION}
    container_name: jms_chen
    hostname: jms_chen
    ulimits:
      core: 0
    restart: always
    stop_grace_period: 55s
    env_file:
      - ${CONFIG_SAFE_FILE}
    volumes:
      - ${VOLUME_DIR}/chen/data:/opt/chen/data
      - ${CONFIG_DIR}/certs:/opt/chen/data/certs
    healthcheck:
      test: ["CMD-SHELL", "if command -v chen-go >/dev/null 2>&1; then chen-go healthcheck; else check http://localhost:8082/chen/healthy; fi"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - net
