services:
  koko:
    image: ${NAMESPACE:-jumpserver}/koko:${VERSION}
    container_name: jms_koko
    hostname: jms_koko
    ulimits:
      core: 0
    restart: always
    privileged: ${KOKO_PRIVILEGED:-true}
    env_file:
      - ${CONFIG_SAFE_FILE}
    environment:
      WEB_PROXY_BIND_HOST: 0.0.0.0
      WEB_PROXY_PORT: 5001
      WEB_PROXY_ALLOWED_HOSTS: ${WEB_PROXY_ALLOWED_HOSTS:-localhost,127.0.0.1}
    ports:
      - ${KOKO_SSH_PORT:-2222}:2222
      - ${KOKO_WEB_PROXY_PORT:-5001}:5001
    volumes:
      - ${CONFIG_DIR}/certs:/opt/koko/data/certs
      - ${VOLUME_DIR}/koko/data:/opt/koko/data
    healthcheck:
      test: "check http://localhost:5000/koko/health/"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - net
