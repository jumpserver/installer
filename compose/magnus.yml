services:
  magnus:
    image: ${NAMESPACE:-jumpserver}/magnus:${VERSION}
    container_name: jms_magnus
    hostname: jms_magnus
    ulimits:
      core: 0
    restart: always
    env_file:
      - ${CONFIG_SAFE_FILE}
    ports:
      - ${MAGNUS_PORT:-5525}:5525
    volumes:
      - ${CONFIG_DIR}/certs:/opt/magnus/data/certs
      - ${VOLUME_DIR}/magnus/data:/opt/magnus/data
    healthcheck:
      test: "check http://localhost:8088/health"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - net
