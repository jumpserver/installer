services:
  core:
    extends:
      file: jdmc.yml
      service: core${JDMC_COMPOSE_SUFFIX:-}
    container_name: jms_core
    hostname: jms_core
    command: sleep
    env_file:
      - ${CONFIG_FILE}
    volumes:
      - ${CONFIG_DIR}/certs:/opt/jumpserver/data/certs
      - ${VOLUME_DIR}/core/data:/opt/jumpserver/data
    networks:
      - net
