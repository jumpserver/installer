on:
  push:
    # Sequence of patterns matched against refs/tags
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

name: Create Release And Upload assets

jobs:
  create-release: # 修正了拼写错误
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version
        id: get_version
        run: |
          TAG=$(basename ${GITHUB_REF})
          echo "TAG=$TAG" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create_release
        uses: release-drafter/release-drafter@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          config-name: release-config.yml
          version: ${{ steps.get_version.outputs.TAG }}
          tag: ${{ steps.get_version.outputs.TAG }}
      
      - name: Create Upload Assets
        env:
          TAG: ${{ steps.get_version.outputs.TAG }}
        run: |
          mkdir -p build
          archive="jumpserver-installer-${TAG}.tar.gz"
          git -c tar.umask=0022 archive --format=tar.gz --prefix="jumpserver-installer-${TAG}/" --output="build/${archive}" HEAD
          cd build
          md5sum "${archive}" > "${archive}.md5"
          sha256sum "${archive}" > "${archive}.sha256"
          
      - name: Release Upload Assets
        run: |
          gh release upload ${{ steps.get_version.outputs.TAG }} build/* -R $GITHUB_REPOSITORY
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
