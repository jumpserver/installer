name: Sync Docker Binaries to OSS

on:
  workflow_dispatch:
  push:
    branches: [dev, master, main, 'v*']
    paths:
      - scripts/const.sh
      - utils/prepare_docker_mirror.sh
      - .github/workflows/oss-sync.yml

permissions:
  contents: read

concurrency:
  group: docker-binaries-oss
  cancel-in-progress: false

env:
  OSS_ENDPOINT: https://oss-cn-beijing.aliyuncs.com
  OSS_REGION: cn-beijing
  OSS_BUCKET: jms-pkg

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check OSS credentials
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        run: |
          set -euo pipefail
          if [[ -z "${OSS_ACCESS_KEY_ID}" || -z "${OSS_ACCESS_KEY_SECRET}" ]]; then
            echo '::error::Set OSS_ACCESS_KEY_ID and OSS_ACCESS_KEY_SECRET in repository Actions secrets.'
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download and verify installer dependencies
        run: bash utils/prepare_docker_mirror.sh "${RUNNER_TEMP}/docker-mirror"

      - name: Install ossutil
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/ossutil.zip"
          curl --fail --silent --show-error --location --retry 3 --connect-timeout 20 --max-time 300 \
            https://gosspublic.alicdn.com/ossutil/v2/2.4.0/ossutil-2.4.0-linux-amd64.zip \
            -o "${archive}"
          echo "85edf66b2fb7238f5c7e25cab820cf29312319fe4935b7c86a6b8485eb434f3c  ${archive}" | sha256sum --check
          unzip -q "${archive}" -d "${RUNNER_TEMP}/ossutil"
          chmod +x "${RUNNER_TEMP}/ossutil/ossutil-2.4.0-linux-amd64/ossutil"
          echo "${RUNNER_TEMP}/ossutil/ossutil-2.4.0-linux-amd64" >> "${GITHUB_PATH}"

      - name: Upload verified files to OSS
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}/docker-mirror"
          while IFS= read -r -d '' file; do
            ossutil cp "${file}" "oss://${OSS_BUCKET}/${file#./}" --force
          done < <(find linux docker -type f -print0)
