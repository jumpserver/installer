name: Sync Docker Binaries to OSS

on:
  workflow_dispatch:
    inputs:
      docker_version:
        description: 'Docker version to sync and write to const.sh (blank: keep current)'
        required: false
        type: string
      docker_compose_version:
        description: 'Compose version, with or without v (blank: keep current)'
        required: false
        type: string
  push:
    branches: [dev, master, main, 'v*']
    paths:
      - scripts/const.sh
      - utils/prepare_docker_mirror.sh
      - utils/update_docker_versions.py
      - .github/workflows/oss-sync.yml

permissions:
  contents: read

concurrency:
  group: docker-binaries-oss
  cancel-in-progress: false

env:
  OSS_ENDPOINT: https://oss-cn-beijing.aliyuncs.com
  OSS_REGION: cn-beijing
  OSS_BUCKET: jms-pkg

jobs:
  sync:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[docker-mirror-synced]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check update target
        if: github.event_name == 'workflow_dispatch' && (inputs.docker_version != '' || inputs.docker_compose_version != '')
        env:
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [[ "${REF_TYPE}" != branch ]]; then
            echo '::error::Select a branch to update const.sh; tags cannot be updated.'
            exit 1
          fi

      - name: Check OSS credentials
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        run: |
          set -euo pipefail
          if [[ -z "${OSS_ACCESS_KEY_ID}" || -z "${OSS_ACCESS_KEY_SECRET}" ]]; then
            echo '::error::Set OSS_ACCESS_KEY_ID and OSS_ACCESS_KEY_SECRET in repository Actions secrets.'
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download installer dependencies and generate checksums
        env:
          DOCKER_VERSION_INPUT: ${{ inputs.docker_version }}
          COMPOSE_VERSION_INPUT: ${{ inputs.docker_compose_version }}
        run: |
          bash utils/prepare_docker_mirror.sh "${RUNNER_TEMP}/docker-mirror" \
            "${DOCKER_VERSION_INPUT}" "${COMPOSE_VERSION_INPUT}"

      - name: Install ossutil
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/ossutil.zip"
          curl --fail --silent --show-error --location --retry 3 --connect-timeout 20 --max-time 300 \
            https://gosspublic.alicdn.com/ossutil/v2/2.4.0/ossutil-2.4.0-linux-amd64.zip \
            -o "${archive}"
          echo "85edf66b2fb7238f5c7e25cab820cf29312319fe4935b7c86a6b8485eb434f3c  ${archive}" | sha256sum --check
          unzip -q "${archive}" -d "${RUNNER_TEMP}/ossutil"
          chmod +x "${RUNNER_TEMP}/ossutil/ossutil-2.4.0-linux-amd64/ossutil"
          echo "${RUNNER_TEMP}/ossutil/ossutil-2.4.0-linux-amd64" >> "${GITHUB_PATH}"

      - name: Upload verified files to OSS
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}/docker-mirror"
          while IFS= read -r -d '' file; do
            ossutil cp "${file}" "oss://${OSS_BUCKET}/${file#./}" --force
          done < <(find linux docker -type f -print0)

      - name: Commit versions and checksums to selected branch
        if: github.event_name == 'workflow_dispatch' && (inputs.docker_version != '' || inputs.docker_compose_version != '')
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_TOKEN || github.token }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cp "${RUNNER_TEMP}/docker-mirror/const.sh" scripts/const.sh
          bash -n scripts/const.sh
          git diff --check
          if git diff --quiet -- scripts/const.sh; then
            echo 'OSS sync completed. const.sh is already up to date.' >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- scripts/const.sh
          git commit -m 'chore: update Docker and Compose versions [docker-mirror-synced]'
          gh auth setup-git
          if ! git push origin "HEAD:refs/heads/${TARGET_BRANCH}"; then
            echo '::error::OSS upload succeeded, but const.sh could not be pushed. Check token write access, branch protection, and concurrent branch updates.'
            exit 1
          fi
          {
            printf 'Updated `scripts/const.sh` on `%s` after successful OSS upload.\n\n' "${TARGET_BRANCH}"
            echo '```diff'
            git show --format= -- scripts/const.sh
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
